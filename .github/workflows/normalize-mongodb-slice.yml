name: Patch MongoDB tools CI pipeline

on:
  push:
    branches:
      - feat/111-mongodb-support

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/111-mongodb-support

      - name: Replace SIGPIPE-prone archive pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = 'tools_root="$(tar -tzf /tmp/mongodb-database-tools.tgz | head -n 1 | cut -d/ -f1)"'
          new = 'tools_root="$(tar -tzf /tmp/mongodb-database-tools.tgz | awk -F/ \'NR == 1 { root = $1 } END { print root }\')"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target pipeline, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/ci.yml

      - name: Commit CI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml
          git commit -m 'fix(ci): avoid SIGPIPE while locating MongoDB tools root'
          git push origin HEAD:feat/111-mongodb-support
