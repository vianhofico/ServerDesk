name: Normalize MongoDB slice files

on:
  push:
    branches:
      - feat/111-mongodb-support

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/111-mongodb-support

      - name: Append required final newlines only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/ServerDesk.Application/Databases/DatabaseBackups.cs
            src/ServerDesk.Application/Databases/DatabaseCertificationMatrix.cs
            src/ServerDesk.Application/Databases/DatabaseConnectivityProbes.cs
            src/ServerDesk.Application/Databases/DatabaseDiagnostics.cs
            src/ServerDesk.Application/Databases/DatabaseProfiles.cs
            src/ServerDesk.Application/Databases/DatabaseRuntimeModels.cs
            src/ServerDesk.Application/Databases/MongoDbDatabaseServices.cs
            src/ServerDesk.Application/Databases/MongoDbRuntimeService.cs
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabase.cs
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabaseBackupManifestRepository.cs
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabaseProfileRepository.cs
            src/ServerDesk.App/App.DatabaseProfiles.cs
            src/ServerDesk.App/App.DatabaseRuntime.cs
            src/ServerDesk.App/DatabaseProfilesWindow.xaml.cs
            tests/ServerDesk.Tests/DatabaseExpansionPersistenceTests.cs
            src/ServerDesk.Infrastructure.Databases/MongoDbDiagnosticAdapter.cs
          )

          for file in "${files[@]}"; do
            test -f "$file"
            last_byte="$(tail -c 1 -- "$file" | od -An -t u1 | tr -d '[:space:]')"
            if [ "$last_byte" != "10" ]; then
              printf '\n' >> "$file"
            fi
          done

          git diff --check
          git diff --stat

      - name: Commit normalization if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/ServerDesk.Application/Databases/DatabaseBackups.cs \
            src/ServerDesk.Application/Databases/DatabaseCertificationMatrix.cs \
            src/ServerDesk.Application/Databases/DatabaseConnectivityProbes.cs \
            src/ServerDesk.Application/Databases/DatabaseDiagnostics.cs \
            src/ServerDesk.Application/Databases/DatabaseProfiles.cs \
            src/ServerDesk.Application/Databases/DatabaseRuntimeModels.cs \
            src/ServerDesk.Application/Databases/MongoDbDatabaseServices.cs \
            src/ServerDesk.Application/Databases/MongoDbRuntimeService.cs \
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabase.cs \
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabaseBackupManifestRepository.cs \
            src/ServerDesk.Infrastructure.Persistence/Sqlite/SqliteDatabaseProfileRepository.cs \
            src/ServerDesk.App/App.DatabaseProfiles.cs \
            src/ServerDesk.App/App.DatabaseRuntime.cs \
            src/ServerDesk.App/DatabaseProfilesWindow.xaml.cs \
            tests/ServerDesk.Tests/DatabaseExpansionPersistenceTests.cs \
            src/ServerDesk.Infrastructure.Databases/MongoDbDiagnosticAdapter.cs
          git commit -m 'style: normalize MongoDB slice final newlines'
          git push origin HEAD:feat/111-mongodb-support
