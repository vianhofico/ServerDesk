name: Patch port-forward manager lifecycle

on:
  push:
    branches:
      - fix/201-port-forward-manager-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply lifecycle patch and regression tests
        run: python .github/scripts/patch-port-forward-manager-lifecycle.py

      - name: Commit lifecycle fix and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Application/PortForwarding/IPortForwarding.cs
          git diff --cached --check
          git commit -m "fix(forwarding): drain manager operations before disposal"
          git add tests/ServerDesk.Tests/PortForwardManagerLifecycleTests.cs
          git diff --cached --check
          git commit -m "test(forwarding): cover manager disposal lifecycle"
          git push
