name: Patch settings persistence drain

on:
  push:
    branches:
      - fix/211-drain-settings-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply settings persistence lifecycle patch
        run: python .github/scripts/patch-settings-persistence-drain.py

      - name: Commit settings persistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.App/Presentation/Shell.cs
          git diff --cached --check
          git commit -m "fix(settings): drain queued saves during shutdown"
          git push
