name: Refine port-forward manager lifecycle

on:
  push:
    branches:
      - fix/201-port-forward-manager-dispose-race

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Preserve existing validation ordering
        run: python .github/scripts/refine-port-forward-manager-lifecycle.py

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Application/PortForwarding/IPortForwarding.cs
          git diff --cached --check
          git commit -m "fix(forwarding): preserve manager validation ordering"
          git push
