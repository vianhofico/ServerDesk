name: Patch terminal lifecycle

on:
  push:
    branches:
      - fix/185-terminal-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply terminal lifecycle patch
        shell: pwsh
        run: |
          $path = 'src/ServerDesk.Infrastructure.Ssh/SshRemoteTerminalSession.cs'
          $text = Get-Content -Raw $path

          $oldFields = @'
              private readonly SemaphoreSlim _stateGate = new(1, 1);
              private readonly SemaphoreSlim _writeGate = new(1, 1);
              private SshClientLease? _lease;
              private ShellStream? _shellStream;
              private CancellationTokenSource? _lifetimeCancellation;
              private Task? _readerTask;
              private bool _disposed;
          '@
          $newFields = @'
              private readonly SemaphoreSlim _stateGate = new(1, 1);
              private readonly SemaphoreSlim _writeGate = new(1, 1);
              private readonly object _lifecycleSync = new();
              private readonly CancellationTokenSource _disposeCancellation = new();
              private readonly TaskCompletionSource _operationsDrained =
                  new(TaskCreationOptions.RunContinuationsAsynchronously);
              private SshClientLease? _lease;
              private ShellStream? _shellStream;
              private CancellationTokenSource? _lifetimeCancellation;
              private Task? _readerTask;
              private int _activeOperations;
              private bool _disposed;
              private Task? _disposeTask;
          '@
          if (-not $text.Contains($oldFields)) { throw 'Expected terminal field block was not found.' }
          $text = $text.Replace($oldFields, $newFields)

          $oldConnect = @'
              public async ValueTask ConnectAsync(
                  TerminalSize initialSize,
                  CancellationToken cancellationToken = default)
              {
                  ThrowIfDisposed();
                  await _stateGate.WaitAsync(cancellationToken).ConfigureAwait(false);
          '@
          $newConnect = @'
              public ValueTask ConnectAsync(
                  TerminalSize initialSize,
                  CancellationToken cancellationToken = default) =>
                  RunOperationAsync(
                      token => ConnectCoreAsync(initialSize, token),
                      cancellationToken);

              private async ValueTask ConnectCoreAsync(
                  TerminalSize initialSize,
                  CancellationToken cancellationToken)
              {
                  await _stateGate.WaitAsync(cancellationToken).ConfigureAwait(false);
          '@
          if (-not $text.Contains($oldConnect)) { throw 'Expected ConnectAsync header was not found.' }
          $text = $text.Replace($oldConnect, $newConnect)

          $oldSend = @'
              public async ValueTask SendAsync(
                  string input,
                  CancellationToken cancellationToken = default)
              {
                  ArgumentNullException.ThrowIfNull(input);
                  ThrowIfDisposed();
                  var shellStream = GetConnectedShell();
          '@
          $newSend = @'
              public ValueTask SendAsync(
                  string input,
                  CancellationToken cancellationToken = default)
              {
                  ArgumentNullException.ThrowIfNull(input);
                  return RunOperationAsync(
                      token => SendCoreAsync(input, token),
                      cancellationToken);
              }

              private async ValueTask SendCoreAsync(
                  string input,
                  CancellationToken cancellationToken)
              {
                  var shellStream = GetConnectedShell();
          '@
          if (-not $text.Contains($oldSend)) { throw 'Expected SendAsync header was not found.' }
          $text = $text.Replace($oldSend, $newSend)

          $oldResize = @'
              public async ValueTask ResizeAsync(
                  TerminalSize size,
                  CancellationToken cancellationToken = default)
              {
                  ThrowIfDisposed();
                  var shellStream = GetConnectedShell();
          '@
          $newResize = @'
              public ValueTask ResizeAsync(
                  TerminalSize size,
                  CancellationToken cancellationToken = default) =>
                  RunOperationAsync(
                      token => ResizeCoreAsync(size, token),
                      cancellationToken);

              private async ValueTask ResizeCoreAsync(
                  TerminalSize size,
                  CancellationToken cancellationToken)
              {
                  var shellStream = GetConnectedShell();
          '@
          if (-not $text.Contains($oldResize)) { throw 'Expected ResizeAsync header was not found.' }
          $text = $text.Replace($oldResize, $newResize)

          $oldDisconnect = @'
              public async ValueTask DisconnectAsync(CancellationToken cancellationToken = default)
              {
                  ThrowIfDisposed();
                  await _stateGate.WaitAsync(cancellationToken).ConfigureAwait(false);
          '@
          $newDisconnect = @'
              public ValueTask DisconnectAsync(CancellationToken cancellationToken = default) =>
                  RunOperationAsync(DisconnectCoreAsync, cancellationToken);

              private async ValueTask DisconnectCoreAsync(CancellationToken cancellationToken)
              {
                  await _stateGate.WaitAsync(cancellationToken).ConfigureAwait(false);
          '@
          if (-not $text.Contains($oldDisconnect)) { throw 'Expected DisconnectAsync header was not found.' }
          $text = $text.Replace($oldDisconnect, $newDisconnect)

          $oldDispose = @'
              public async ValueTask DisposeAsync()
              {
                  if (_disposed)
                  {
                      return;
                  }

                  _disposed = true;
                  await _stateGate.WaitAsync(CancellationToken.None).ConfigureAwait(false);
                  try
                  {
                      await DisposeConnectionAsync().ConfigureAwait(false);
                      State = TerminalSessionState.Disconnected;
                  }
                  finally
                  {
                      _stateGate.Release();
                      _stateGate.Dispose();
                      _writeGate.Dispose();
                  }
              }
          '@
          $newDispose = @'
              public ValueTask DisposeAsync()
              {
                  lock (_lifecycleSync)
                  {
                      if (_disposeTask is not null)
                      {
                          return new ValueTask(_disposeTask);
                      }

                      _disposed = true;
                      var drainTask = _activeOperations == 0
                          ? Task.CompletedTask
                          : _operationsDrained.Task;
                      _disposeTask = DisposeCoreAsync(drainTask);
                      return new ValueTask(_disposeTask);
                  }
              }

              private async Task DisposeCoreAsync(Task drainTask)
              {
                  await _disposeCancellation.CancelAsync().ConfigureAwait(false);
                  await drainTask.ConfigureAwait(false);
                  try
                  {
                      await DisposeConnectionAsync().ConfigureAwait(false);
                      State = TerminalSessionState.Disconnected;
                  }
                  finally
                  {
                      _stateGate.Dispose();
                      _writeGate.Dispose();
                      _disposeCancellation.Dispose();
                  }
              }

              private async ValueTask RunOperationAsync(
                  Func<CancellationToken, ValueTask> operation,
                  CancellationToken cancellationToken)
              {
                  BeginOperation();
                  try
                  {
                      using var operationCancellation = CancellationTokenSource.CreateLinkedTokenSource(
                          cancellationToken,
                          _disposeCancellation.Token);
                      await operation(operationCancellation.Token).ConfigureAwait(false);
                  }
                  finally
                  {
                      EndOperation();
                  }
              }

              private void BeginOperation()
              {
                  lock (_lifecycleSync)
                  {
                      ObjectDisposedException.ThrowIf(_disposed, this);
                      _activeOperations++;
                  }
              }

              private void EndOperation()
              {
                  lock (_lifecycleSync)
                  {
                      _activeOperations--;
                      if (_disposed && _activeOperations == 0)
                      {
                          _operationsDrained.TrySetResult();
                      }
                  }
              }
          '@
          if (-not $text.Contains($oldDispose)) { throw 'Expected DisposeAsync block was not found.' }
          $text = $text.Replace($oldDispose, $newDispose)

          $oldThrow = @'
              private void ThrowIfDisposed()
              {
                  ObjectDisposedException.ThrowIf(_disposed, this);
              }
          '@
          if (-not $text.Contains($oldThrow)) { throw 'Expected ThrowIfDisposed helper was not found.' }
          $text = $text.Replace($oldThrow, '')

          Set-Content -Path $path -Value $text -NoNewline
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Infrastructure.Ssh/SshRemoteTerminalSession.cs
          git diff --cached --check
          git commit -m "fix(terminal): drain operations before disposal"
          git push
