name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build, format and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ServerDesk.sln

      - name: Verify formatting
        run: dotnet format ServerDesk.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ServerDesk.sln --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Test
        run: dotnet test tests/ServerDesk.Tests/ServerDesk.Tests.csproj --configuration Release --no-build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: artifacts/build.binlog
          if-no-files-found: ignore
          retention-days: 7

  ssh-integration:
    name: OpenSSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SERVERDESK_SSH_HOST: 127.0.0.1
      SERVERDESK_SSH_PORT: 2222
      SERVERDESK_SSH_TARGET_PORT: 2223
      SERVERDESK_SSH_USER: serverdesk_ci
      SERVERDESK_SSH_PASSWORD: serverdesk-password
      SERVERDESK_SSH_KEY: /tmp/serverdesk_ci_key
      SERVERDESK_SSH_KEY_PASSPHRASE: serverdesk-key-pass
      SERVERDESK_SFTP_HOME: /home/serverdesk_ci
      SERVERDESK_SFTP_DENIED_PATH: /tmp/serverdesk-sftp-denied
      SERVERDESK_FORWARD_HTTP_PORT: 18080
      SERVERDESK_HTTP_PROXY_PORT: 18081
      SERVERDESK_SOCKS4_PROXY_PORT: 18082
      SERVERDESK_SOCKS5_PROXY_PORT: 18083
      SERVERDESK_DB_PASSWORD: serverdesk-db-password
      SERVERDESK_POSTGRES_PORT: 15432
      SERVERDESK_MYSQL_PORT: 13306
      SERVERDESK_MARIADB_PORT: 13307
      SERVERDESK_REDIS_PORT: 16379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure disposable OpenSSH server and proxy fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server

          sudo useradd -m -s /bin/bash serverdesk_ci
          echo 'serverdesk_ci:serverdesk-password' | sudo chpasswd

          ssh-keygen -q -t ed25519 -N 'serverdesk-key-pass' -f /tmp/serverdesk_ci_key
          sudo install -d -m 700 -o serverdesk_ci -g serverdesk_ci /home/serverdesk_ci/.ssh
          sudo install -m 600 -o serverdesk_ci -g serverdesk_ci /tmp/serverdesk_ci_key.pub /home/serverdesk_ci/.ssh/authorized_keys

          sudo -u serverdesk_ci ln -s /etc/hosts /home/serverdesk_ci/serverdesk-fixture-link
          sudo install -d -m 700 -o root -g root /tmp/serverdesk-sftp-denied
          sudo install -d -m 755 -o serverdesk_ci -g serverdesk_ci /tmp/serverdesk-forward-http
          echo 'serverdesk-forward-ok' | sudo tee /tmp/serverdesk-forward-http/index.html >/dev/null
          sudo chown serverdesk_ci:serverdesk_ci /tmp/serverdesk-forward-http/index.html
          sudo -u serverdesk_ci nohup python3 -m http.server 18080 \
            --bind 127.0.0.1 --directory /tmp/serverdesk-forward-http \
            >/tmp/serverdesk-forward-http.log 2>&1 &

          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode http --port 18081 >/tmp/serverdesk-http-proxy.log 2>&1 &
          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode socks4 --port 18082 >/tmp/serverdesk-socks4-proxy.log 2>&1 &
          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode socks5 --port 18083 >/tmp/serverdesk-socks5-proxy.log 2>&1 &

          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          cat <<'EOF' | sudo tee /tmp/serverdesk-sshd_config >/dev/null
          Port 2222
          Port 2223
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          PubkeyAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          PermitRootLogin no
          AllowUsers serverdesk_ci
          AllowTcpForwarding yes
          GatewayPorts no
          Subsystem sftp internal-sftp
          PidFile /tmp/serverdesk-sshd.pid
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/serverdesk-sshd_config -E /tmp/serverdesk-sshd.log
          for attempt in {1..30}; do
            if ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && \
               ssh-keyscan -p 2223 127.0.0.1 >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && \
               python3 -c 'import socket; [socket.create_connection(("127.0.0.1", p), timeout=1).close() for p in (18081, 18082, 18083)]'; then
              exit 0
            fi
            sleep 0.25
          done

          cat /tmp/serverdesk-sshd.log || true
          exit 1

      - name: Configure certified database engine fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name serverdesk-postgres \
            -e POSTGRES_USER=serverdesk \
            -e POSTGRES_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e POSTGRES_DB=serverdesk \
            -p 127.0.0.1:${SERVERDESK_POSTGRES_PORT}:5432 \
            postgres:18.6
          docker run -d --name serverdesk-mysql \
            -e MYSQL_DATABASE=serverdesk \
            -e MYSQL_USER=serverdesk \
            -e MYSQL_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e MYSQL_ROOT_PASSWORD=serverdesk-root-password \
            -p 127.0.0.1:${SERVERDESK_MYSQL_PORT}:3306 \
            mysql:8.4.11
          docker run -d --name serverdesk-mariadb \
            -e MARIADB_DATABASE=serverdesk \
            -e MARIADB_USER=serverdesk \
            -e MARIADB_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e MARIADB_ROOT_PASSWORD=serverdesk-root-password \
            -p 127.0.0.1:${SERVERDESK_MARIADB_PORT}:3306 \
            mariadb:11.8.9
          docker run -d --name serverdesk-redis \
            -p 127.0.0.1:${SERVERDESK_REDIS_PORT}:6379 \
            redis:8.10.0 redis-server --requirepass "$SERVERDESK_DB_PASSWORD"

          for attempt in {1..90}; do
            postgres_ready=false
            mysql_ready=false
            mariadb_ready=false
            redis_ready=false
            docker exec serverdesk-postgres pg_isready -U serverdesk -d serverdesk >/dev/null 2>&1 && postgres_ready=true
            docker exec serverdesk-mysql mysqladmin ping -h 127.0.0.1 -u serverdesk -p"$SERVERDESK_DB_PASSWORD" --silent >/dev/null 2>&1 && mysql_ready=true
            docker exec serverdesk-mariadb mariadb-admin ping -h 127.0.0.1 -u serverdesk -p"$SERVERDESK_DB_PASSWORD" --silent >/dev/null 2>&1 && mariadb_ready=true
            docker exec -e REDISCLI_AUTH="$SERVERDESK_DB_PASSWORD" serverdesk-redis redis-cli ping 2>/dev/null | grep -qx PONG && redis_ready=true
            if $postgres_ready && $mysql_ready && $mariadb_ready && $redis_ready; then
              exit 0
            fi
            sleep 1
          done

          docker ps -a
          exit 1

      - name: Restore integration tests
        run: dotnet restore tests/ServerDesk.Ssh.IntegrationTests/ServerDesk.Ssh.IntegrationTests.csproj

      - name: Run SSH, SFTP, PTY, forwarding, routing and database integration tests
        run: dotnet test tests/ServerDesk.Ssh.IntegrationTests/ServerDesk.Ssh.IntegrationTests.csproj --configuration Release --no-restore

      - name: Show fixture logs on failure
        if: failure()
        run: |
          sudo cat /tmp/serverdesk-sshd.log || true
          cat /tmp/serverdesk-forward-http.log || true
          cat /tmp/serverdesk-http-proxy.log || true
          cat /tmp/serverdesk-socks4-proxy.log || true
          cat /tmp/serverdesk-socks5-proxy.log || true
          docker ps -a || true
          docker logs serverdesk-postgres || true
          docker logs serverdesk-mysql || true
          docker logs serverdesk-mariadb || true
          docker logs serverdesk-redis || true
