name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build, format and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ServerDesk.sln

      - name: Verify formatting
        run: dotnet format ServerDesk.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ServerDesk.sln --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Test
        run: dotnet test tests/ServerDesk.Tests/ServerDesk.Tests.csproj --configuration Release --no-build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: artifacts/build.binlog
          if-no-files-found: ignore
          retention-days: 7
