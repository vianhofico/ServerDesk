name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build, format and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ServerDesk.sln

      - name: Verify formatting
        run: dotnet format ServerDesk.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ServerDesk.sln --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Test
        run: dotnet test tests/ServerDesk.Tests/ServerDesk.Tests.csproj --configuration Release --no-build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: artifacts/build.binlog
          if-no-files-found: ignore
          retention-days: 7

  ssh-integration:
    name: OpenSSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SERVERDESK_SSH_HOST: 127.0.0.1
      SERVERDESK_SSH_PORT: 2222
      SERVERDESK_SSH_TARGET_PORT: 2223
      SERVERDESK_SSH_USER: serverdesk_ci
      SERVERDESK_SSH_PASSWORD: serverdesk-password
      SERVERDESK_SSH_KEY: /tmp/serverdesk_ci_key
      SERVERDESK_SSH_KEY_PASSPHRASE: serverdesk-key-pass
      SERVERDESK_SFTP_HOME: /home/serverdesk_ci
      SERVERDESK_SFTP_DENIED_PATH: /tmp/serverdesk-sftp-denied
      SERVERDESK_FORWARD_HTTP_PORT: 18080
      SERVERDESK_HTTP_PROXY_PORT: 18081
      SERVERDESK_SOCKS4_PROXY_PORT: 18082
      SERVERDESK_SOCKS5_PROXY_PORT: 18083
      SERVERDESK_DB_PASSWORD: serverdesk-db-password
      SERVERDESK_POSTGRES_PORT: 15432
      SERVERDESK_MYSQL_PORT: 13306
      SERVERDESK_MARIADB_PORT: 13307
      SERVERDESK_REDIS_PORT: 16379
      SERVERDESK_SQLSERVER_PORT: 11433
      SERVERDESK_SQLSERVER_VERSION: 17.0.4075.5
      SERVERDESK_DB_BACKUP_DIR: /tmp/serverdesk-db-backups

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure disposable OpenSSH server and proxy fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server acl

          sudo useradd -m -s /bin/bash serverdesk_ci
          echo 'serverdesk_ci:serverdesk-password' | sudo chpasswd

          ssh-keygen -q -t ed25519 -N 'serverdesk-key-pass' -f /tmp/serverdesk_ci_key
          sudo install -d -m 700 -o serverdesk_ci -g serverdesk_ci /home/serverdesk_ci/.ssh
          sudo install -m 600 -o serverdesk_ci -g serverdesk_ci /tmp/serverdesk_ci_key.pub /home/serverdesk_ci/.ssh/authorized_keys

          sudo -u serverdesk_ci ln -s /etc/hosts /home/serverdesk_ci/serverdesk-fixture-link
          sudo install -d -m 700 -o root -g root /tmp/serverdesk-sftp-denied
          sudo install -d -m 755 -o serverdesk_ci -g serverdesk_ci /tmp/serverdesk-forward-http
          echo 'serverdesk-forward-ok' | sudo tee /tmp/serverdesk-forward-http/index.html >/dev/null
          sudo chown serverdesk_ci:serverdesk_ci /tmp/serverdesk-forward-http/index.html
          sudo -u serverdesk_ci nohup python3 -m http.server 18080 \
            --bind 127.0.0.1 --directory /tmp/serverdesk-forward-http \
            >/tmp/serverdesk-forward-http.log 2>&1 &

          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode http --port 18081 >/tmp/serverdesk-http-proxy.log 2>&1 &
          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode socks4 --port 18082 >/tmp/serverdesk-socks4-proxy.log 2>&1 &
          nohup python3 tests/ServerDesk.Ssh.IntegrationTests/Fixtures/tcp_proxy_fixture.py \
            --mode socks5 --port 18083 >/tmp/serverdesk-socks5-proxy.log 2>&1 &

          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          cat <<'EOF' | sudo tee /tmp/serverdesk-sshd_config >/dev/null
          Port 2222
          Port 2223
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          PubkeyAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          PermitRootLogin no
          AllowUsers serverdesk_ci
          AllowTcpForwarding yes
          GatewayPorts no
          Subsystem sftp internal-sftp
          PidFile /tmp/serverdesk-sshd.pid
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f /tmp/serverdesk-sshd_config -E /tmp/serverdesk-sshd.log
          for attempt in {1..30}; do
            if ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && \
               ssh-keyscan -p 2223 127.0.0.1 >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && \
               python3 -c 'import socket; [socket.create_connection(("127.0.0.1", p), timeout=1).close() for p in (18081, 18082, 18083)]'; then
              exit 0
            fi
            sleep 0.25
          done

          cat /tmp/serverdesk-sshd.log || true
          exit 1

      - name: Configure certified database engine fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0777 "$SERVERDESK_DB_BACKUP_DIR"
          sudo setfacl -m u:serverdesk_ci:rwx,m::rwx "$SERVERDESK_DB_BACKUP_DIR"
          sudo setfacl -m d:u:serverdesk_ci:rwx,d:m::rwx "$SERVERDESK_DB_BACKUP_DIR"

          SQLSERVER_PASSWORD="Sd!9A$(openssl rand -hex 18)z#"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          echo "SERVERDESK_SQLSERVER_PASSWORD=$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          export SERVERDESK_SQLSERVER_PASSWORD="$SQLSERVER_PASSWORD"

          docker run -d --name serverdesk-postgres \
            -e POSTGRES_USER=serverdesk \
            -e POSTGRES_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e POSTGRES_DB=serverdesk \
            -p 127.0.0.1:${SERVERDESK_POSTGRES_PORT}:5432 \
            postgres:18.6
          docker run -d --name serverdesk-mysql \
            -e MYSQL_DATABASE=serverdesk \
            -e MYSQL_USER=serverdesk \
            -e MYSQL_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e MYSQL_ROOT_PASSWORD=serverdesk-root-password \
            -p 127.0.0.1:${SERVERDESK_MYSQL_PORT}:3306 \
            mysql:8.4.11
          docker run -d --name serverdesk-mariadb \
            -e MARIADB_DATABASE=serverdesk \
            -e MARIADB_USER=serverdesk \
            -e MARIADB_PASSWORD="$SERVERDESK_DB_PASSWORD" \
            -e MARIADB_ROOT_PASSWORD=serverdesk-root-password \
            -p 127.0.0.1:${SERVERDESK_MARIADB_PORT}:3306 \
            mariadb:11.8.9
          docker run -d --name serverdesk-redis \
            -p 127.0.0.1:${SERVERDESK_REDIS_PORT}:6379 \
            redis:8.10.0 redis-server --requirepass "$SERVERDESK_DB_PASSWORD"
          docker run -d --name serverdesk-sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$SERVERDESK_SQLSERVER_PASSWORD" \
            -p 127.0.0.1:${SERVERDESK_SQLSERVER_PORT}:1433 \
            -v "$SERVERDESK_DB_BACKUP_DIR:$SERVERDESK_DB_BACKUP_DIR" \
            mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04

          for attempt in {1..120}; do
            postgres_ready=false
            mysql_ready=false
            mariadb_ready=false
            redis_ready=false
            sqlserver_ready=false
            docker exec serverdesk-postgres pg_isready -U serverdesk -d serverdesk >/dev/null 2>&1 && postgres_ready=true
            docker exec serverdesk-mysql mysqladmin ping -h 127.0.0.1 -u serverdesk -p"$SERVERDESK_DB_PASSWORD" --silent >/dev/null 2>&1 && mysql_ready=true
            docker exec serverdesk-mariadb mariadb-admin ping -h 127.0.0.1 -u serverdesk -p"$SERVERDESK_DB_PASSWORD" --silent >/dev/null 2>&1 && mariadb_ready=true
            docker exec -e REDISCLI_AUTH="$SERVERDESK_DB_PASSWORD" serverdesk-redis redis-cli ping 2>/dev/null | grep -qx PONG && redis_ready=true
            docker exec -e SQLCMDPASSWORD="$SERVERDESK_SQLSERVER_PASSWORD" serverdesk-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1 && sqlserver_ready=true
            if $postgres_ready && $mysql_ready && $mariadb_ready && $redis_ready && $sqlserver_ready; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              docker ps -a
              docker logs serverdesk-sqlserver || true
              exit 1
            fi
            sleep 1
          done

          actual_sqlserver_version="$(docker exec -e SQLCMDPASSWORD="$SERVERDESK_SQLSERVER_PASSWORD" serverdesk-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT CAST(SERVERPROPERTY('ProductVersion') AS varchar(128));" \
            | tr -d '\r' | xargs)"
          if [ "$actual_sqlserver_version" != "$SERVERDESK_SQLSERVER_VERSION" ]; then
            echo "SQL Server fixture version mismatch: expected $SERVERDESK_SQLSERVER_VERSION, observed $actual_sqlserver_version" >&2
            exit 1
          fi

          docker exec -e SQLCMDPASSWORD="$SERVERDESK_SQLSERVER_PASSWORD" serverdesk-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b \
            -Q "IF DB_ID(N'serverdesk') IS NULL CREATE DATABASE [serverdesk]; IF DB_ID(N'serverdesk_restore') IS NULL CREATE DATABASE [serverdesk_restore];"

      - name: Configure certified database backup tool wrappers
        shell: bash
        run: |
          set -euo pipefail
          sudo usermod -aG docker serverdesk_ci
          sudo install -d -m 0777 "$SERVERDESK_DB_BACKUP_DIR"

          cat <<'EOF' | sudo tee /usr/local/bin/pg_dump >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e PGPASSWORD \
            -v /tmp/serverdesk-db-backups:/tmp/serverdesk-db-backups \
            postgres:18.6 pg_dump "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/pg_restore >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host \
            -v /tmp/serverdesk-db-backups:/tmp/serverdesk-db-backups \
            postgres:18.6 pg_restore "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/mysqldump >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e MYSQL_PWD \
            -v /tmp/serverdesk-db-backups:/tmp/serverdesk-db-backups \
            mysql:8.4.11 mysqldump "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/mariadb-dump >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e MYSQL_PWD \
            -v /tmp/serverdesk-db-backups:/tmp/serverdesk-db-backups \
            mariadb:11.8.9 mariadb-dump "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/sqlcmd >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e SQLCMDPASSWORD \
            --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04 "$@" \
            2> >(tee -a /tmp/serverdesk-sqlserver-client.stderr >&2)
          EOF
          sudo chmod 0755 /usr/local/bin/pg_dump /usr/local/bin/pg_restore /usr/local/bin/mysqldump /usr/local/bin/mariadb-dump /usr/local/bin/sqlcmd
          sudo -u serverdesk_ci docker version >/dev/null

      - name: Configure certified database restore targets and tool wrappers
        shell: bash
        run: |
          set -euo pipefail

          docker exec serverdesk-postgres psql -v ON_ERROR_STOP=1 -U serverdesk -d postgres \
            -c 'DROP DATABASE IF EXISTS serverdesk_restore' \
            -c 'CREATE DATABASE serverdesk_restore'
          docker exec serverdesk-mysql mysql -uroot -pserverdesk-root-password \
            -e "DROP DATABASE IF EXISTS serverdesk_restore; CREATE DATABASE serverdesk_restore; GRANT ALL PRIVILEGES ON serverdesk_restore.* TO 'serverdesk'@'%'; FLUSH PRIVILEGES;"
          docker exec serverdesk-mariadb mariadb -uroot -pserverdesk-root-password \
            -e "DROP DATABASE IF EXISTS serverdesk_restore; CREATE DATABASE serverdesk_restore; GRANT ALL PRIVILEGES ON serverdesk_restore.* TO 'serverdesk'@'%'; FLUSH PRIVILEGES;"
          docker exec -e SQLCMDPASSWORD="$SERVERDESK_SQLSERVER_PASSWORD" serverdesk-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b \
            -Q "IF DB_ID(N'serverdesk_restore') IS NULL CREATE DATABASE [serverdesk_restore];"

          cat <<'EOF' | sudo tee /usr/local/bin/pg_restore >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e PGPASSWORD \
            -v /tmp/serverdesk-db-backups:/tmp/serverdesk-db-backups \
            postgres:18.6 pg_restore "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/psql >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e PGPASSWORD postgres:18.6 psql "$@"
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/mysql >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e MYSQL_PWD mysql:8.4.11 mysql "$@" \
            2> >(tee -a /tmp/serverdesk-mysql-client.stderr >&2)
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/mariadb >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e MYSQL_PWD mariadb:11.8.9 mariadb "$@" \
            2> >(tee -a /tmp/serverdesk-mariadb-client.stderr >&2)
          EOF
          cat <<'EOF' | sudo tee /usr/local/bin/sqlcmd >/dev/null
          #!/usr/bin/env bash
          exec docker run --rm -i --network host -e SQLCMDPASSWORD \
            --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04 "$@" \
            2> >(tee -a /tmp/serverdesk-sqlserver-client.stderr >&2)
          EOF
          sudo chmod 0755 /usr/local/bin/pg_restore /usr/local/bin/psql /usr/local/bin/mysql /usr/local/bin/mariadb /usr/local/bin/sqlcmd
          sudo -u serverdesk_ci docker version >/dev/null

      - name: Restore integration tests
        run: dotnet restore tests/ServerDesk.Ssh.IntegrationTests/ServerDesk.Ssh.IntegrationTests.csproj

      - name: Run SSH, SFTP, PTY, forwarding, routing and database integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test-results
          dotnet test \
            --project tests/ServerDesk.Ssh.IntegrationTests/ServerDesk.Ssh.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            2>&1 | tee artifacts/test-results/ssh-integration.log

      - name: Collect database restore diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          cp /tmp/serverdesk-mysql-client.stderr artifacts/test-results/mysql-client.stderr 2>/dev/null || true
          cp /tmp/serverdesk-mariadb-client.stderr artifacts/test-results/mariadb-client.stderr 2>/dev/null || true
          cp /tmp/serverdesk-sqlserver-client.stderr artifacts/test-results/sqlserver-client.stderr 2>/dev/null || true

      - name: Upload SSH integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-integration-test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Show fixture logs on failure
        if: failure()
        run: |
          sudo cat /tmp/serverdesk-sshd.log || true
          cat /tmp/serverdesk-forward-http.log || true
          cat /tmp/serverdesk-http-proxy.log || true
          cat /tmp/serverdesk-socks4-proxy.log || true
          cat /tmp/serverdesk-socks5-proxy.log || true
          cat /tmp/serverdesk-mysql-client.stderr || true
          cat /tmp/serverdesk-mariadb-client.stderr || true
          cat /tmp/serverdesk-sqlserver-client.stderr || true
          docker ps -a || true
          docker logs serverdesk-postgres || true
          docker logs serverdesk-mysql || true
          docker logs serverdesk-mariadb || true
          docker logs serverdesk-redis || true
          docker logs serverdesk-sqlserver || true
          ls -la /tmp/serverdesk-db-backups || true
