name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ServerDesk.App/ServerDesk.App.csproj

      - name: Build
        run: dotnet build src/ServerDesk.App/ServerDesk.App.csproj --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path tests -Filter *.csproj -Recurse -ErrorAction SilentlyContinue
          if ($testProjects.Count -eq 0) {
            Write-Host "No test projects exist yet; M0/M1 must introduce them before feature logic grows."
            exit 0
          }

          foreach ($project in $testProjects) {
            dotnet test $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
