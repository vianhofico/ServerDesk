name: Patch SSH session lifecycle

on:
  push:
    branches:
      - fix/198-ssh-session-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply lifecycle patch and regression test
        run: python .github/scripts/patch-ssh-session-lifecycle.py

      - name: Commit lifecycle fix and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Infrastructure.Ssh/SshRemoteSession.cs
          git diff --cached --check
          git commit -m "fix(ssh): drain control-session operations before disposal"
          git add tests/ServerDesk.Tests/SshRemoteSessionLifecycleTests.cs
          git diff --cached --check
          git commit -m "test(ssh): cover control-session disposal lifecycle"
          git push
