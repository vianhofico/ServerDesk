name: Patch port-forward lifecycle

on:
  push:
    branches:
      - fix/195-port-forward-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply lifecycle patch and regression test
        run: python .github/scripts/patch-port-forward-lifecycle.py

      - name: Commit lifecycle fix and test
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Infrastructure.Ssh/SshPortForwardSession.cs
          git diff --cached --check
          git commit -m "fix(ssh): drain port-forward operations before disposal"
          git add tests/ServerDesk.Tests/SshPortForwardSessionLifecycleTests.cs
          git diff --cached --check
          git commit -m "test(ssh): cover port-forward disposal lifecycle"
          git push
