name: Patch route password rollback

on:
  push:
    branches:
      - fix/219-route-password-rollback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply route password rollback patch
        run: python .github/scripts/patch-route-password-rollback.py

      - name: Commit implementation and regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Application/Routing/ServerConnectionRouting.cs
          git diff --cached --check
          git commit -m "fix(routing): restore proxy password on failed save"
          git add tests/ServerDesk.Tests/ConnectionRouteServiceTests.cs
          git diff --cached --check
          git commit -m "test(routing): cover proxy password rollback"
          git push
