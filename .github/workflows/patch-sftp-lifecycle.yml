name: Patch SFTP lifecycle

on:
  push:
    branches:
      - fix/187-sftp-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply lifecycle patch and integration regression
        run: python .github/scripts/patch-sftp-lifecycle.py

      - name: Commit lifecycle fix and test
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Infrastructure.Ssh/SftpRemoteFileSystem.cs
          git diff --cached --check
          git commit -m "fix(sftp): serialize operations across connection teardown"
          git add tests/ServerDesk.Ssh.IntegrationTests/SftpIntegrationTests.cs
          git diff --cached --check
          git commit -m "test(sftp): cover disposal during active upload"
          git push
