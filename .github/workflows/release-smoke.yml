name: Release Publish Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-smoke:
    name: Self-contained win-x64 publish
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish release candidate
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'serverdesk-release-smoke'
          ./scripts/publish-windows-release.ps1 -OutputDirectory $publishDir

      - name: Upload release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-publish-diagnostics
          path: artifacts/release-publish/*.binlog
          if-no-files-found: ignore
          retention-days: 7
