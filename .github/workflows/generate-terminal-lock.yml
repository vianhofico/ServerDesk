name: Generate terminal lockfile

on:
  push:
    branches:
      - chore/176-terminal-lockfile

permissions:
  contents: write

jobs:
  generate:
    name: Generate npm lockfile
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Generate lockfile from exact package pins
        working-directory: src/ServerDesk.App/TerminalFrontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile when changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.App/TerminalFrontend/package-lock.json
          if (git diff --cached --quiet) {
            Write-Host "Lockfile is already current."
            exit 0
          }
          git commit -m "chore(terminal): generate npm lockfile"
          git push
