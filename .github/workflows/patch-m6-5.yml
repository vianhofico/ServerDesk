name: Patch M6.5 restore semantics

on:
  push:
    branches:
      - feat/98-database-restore

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/98-database-restore
          fetch-depth: 0

      - name: Apply exact MySQL-family restore fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('src/ServerDesk.Application/Databases/DatabaseRestoreService.cs')
          service = service_path.read_text()

          old_args = '''            "--batch",\n            "--raw",\n            "--one-database",\n            $"--database={targetDatabase}",\n'''
          new_args = '''            "--batch",\n            "--raw",\n            $"--database={targetDatabase}",\n'''
          if service.count(old_args) != 1:
              raise SystemExit('Expected exactly one MySQL restore argument block')
          service = service.replace(old_args, new_args)

          old_warning = '''            $"Destructive data-loss-sensitive logical restore is restricted to exactly '{targetDatabase}' with --one-database. DDL/DML in the verified dump may overwrite or drop represented objects; objects absent from the dump may remain. No automatic rollback is available.",'''
          new_warning = '''            $"Destructive data-loss-sensitive logical restore is restricted to the verified ServerDesk backup manifest bound to exactly '{targetDatabase}'. DDL/DML in that checksum-verified dump may overwrite or drop represented objects; objects absent from the dump may remain. No automatic rollback is available.",'''
          if service.count(old_warning) != 1:
              raise SystemExit('Expected exactly one MySQL restore warning')
          service = service.replace(old_warning, new_warning)

          old_display = '''        return $"{tool} --host={Token(profile.RemoteHost)} --port={profile.RemotePort.ToString(CultureInfo.InvariantCulture)} --one-database --database={Token(targetDatabase)} < {Token(manifest.BackupPath.Value)} [credential via sensitive stdin when configured]";'''
          new_display = '''        return $"{tool} --host={Token(profile.RemoteHost)} --port={profile.RemotePort.ToString(CultureInfo.InvariantCulture)} --database={Token(targetDatabase)} < {Token(manifest.BackupPath.Value)} [verified manifest/checksum; credential via sensitive stdin when configured]";'''
          if service.count(old_display) != 1:
              raise SystemExit('Expected exactly one MySQL display command')
          service = service.replace(old_display, new_display)
          service_path.write_text(service)

          test_path = Path('tests/ServerDesk.Tests/DatabaseRestoreServiceTests.cs')
          tests = test_path.read_text()
          old_name = 'MySqlFamilyRestoreUsesOneDatabaseAndRemoteFileRedirectionWithoutSecretArguments'
          new_name = 'MySqlFamilyRestoreUsesVerifiedManifestAndRemoteFileRedirectionWithoutSecretArguments'
          if tests.count(old_name) != 1:
              raise SystemExit('Expected exactly one MySQL restore test name')
          tests = tests.replace(old_name, new_name)
          old_assert = '        Assert.Contains("--one-database", preview.Arguments);'
          new_assert = '        Assert.DoesNotContain("--one-database", preview.Arguments);'
          if tests.count(old_assert) != 1:
              raise SystemExit('Expected exactly one --one-database assertion')
          tests = tests.replace(old_assert, new_assert)
          test_path.write_text(tests)

          Path('.github/workflows/patch-m6-5.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ServerDesk.Application/Databases/DatabaseRestoreService.cs \
                  tests/ServerDesk.Tests/DatabaseRestoreServiceTests.cs \
                  .github/workflows/patch-m6-5.yml
          git diff --cached --check
          git commit -m 'fix(m6.5): restore verified mysql dumps without one-database filtering'
          git push origin HEAD:feat/98-database-restore
