name: Patch capability dispose race

on:
  push:
    branches:
      - fix/179-capability-dispose-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply lifecycle coordination patch
        shell: pwsh
        run: |
          $path = 'src/ServerDesk.Application/Capabilities/ServerCapabilities.cs'
          $text = Get-Content -Raw $path

          $oldFields = @'
              private readonly ConcurrentDictionary<Guid, CacheEntry> _cache = new();
              private readonly ConcurrentDictionary<Guid, SemaphoreSlim> _locks = new();
              private bool _disposed;
          '@
          $newFields = @'
              private readonly ConcurrentDictionary<Guid, CacheEntry> _cache = new();
              private readonly ConcurrentDictionary<Guid, SemaphoreSlim> _locks = new();
              private readonly object _lifecycleSync = new();
              private readonly TaskCompletionSource _operationsDrained =
                  new(TaskCreationOptions.RunContinuationsAsynchronously);
              private int _activeOperations;
              private bool _disposed;
              private Task? _disposeTask;
          '@
          if (-not $text.Contains($oldFields)) { throw 'Expected lifecycle field block was not found.' }
          $text = $text.Replace($oldFields, $newFields)

          $oldGet = @'
              public async ValueTask<ServerCapabilitySnapshot> GetAsync(
                  ServerProfile profile,
                  bool forceRefresh = false,
                  CancellationToken cancellationToken = default)
              {
                  ArgumentNullException.ThrowIfNull(profile);
                  ObjectDisposedException.ThrowIf(_disposed, this);
                  if (!forceRefresh && TryGetFresh(profile.Id, out var cached))
                  {
                      return cached;
                  }

                  var gate = _locks.GetOrAdd(profile.Id, _ => new SemaphoreSlim(1, 1));
                  await gate.WaitAsync(cancellationToken).ConfigureAwait(false);
                  try
                  {
                      if (!forceRefresh && TryGetFresh(profile.Id, out cached))
                      {
                          return cached;
                      }

                      await using var executor = _executorFactory.Create(profile);
                      var snapshot = await ScanAsync(profile, executor, cancellationToken).ConfigureAwait(false);
                      _cache[profile.Id] = new CacheEntry(snapshot, DateTimeOffset.UtcNow + _options.CacheDuration);
                      return snapshot;
                  }
                  finally
                  {
                      gate.Release();
                  }
              }
          '@
          $newGet = @'
              public async ValueTask<ServerCapabilitySnapshot> GetAsync(
                  ServerProfile profile,
                  bool forceRefresh = false,
                  CancellationToken cancellationToken = default)
              {
                  ArgumentNullException.ThrowIfNull(profile);
                  BeginOperation();
                  try
                  {
                      if (!forceRefresh && TryGetFresh(profile.Id, out var cached))
                      {
                          return cached;
                      }

                      var gate = _locks.GetOrAdd(profile.Id, _ => new SemaphoreSlim(1, 1));
                      await gate.WaitAsync(cancellationToken).ConfigureAwait(false);
                      try
                      {
                          if (!forceRefresh && TryGetFresh(profile.Id, out cached))
                          {
                              return cached;
                          }

                          await using var executor = _executorFactory.Create(profile);
                          var snapshot = await ScanAsync(profile, executor, cancellationToken).ConfigureAwait(false);
                          _cache[profile.Id] = new CacheEntry(snapshot, DateTimeOffset.UtcNow + _options.CacheDuration);
                          return snapshot;
                      }
                      finally
                      {
                          gate.Release();
                      }
                  }
                  finally
                  {
                      EndOperation();
                  }
              }
          '@
          if (-not $text.Contains($oldGet)) { throw 'Expected GetAsync block was not found.' }
          $text = $text.Replace($oldGet, $newGet)

          $oldDispose = @'
              public ValueTask DisposeAsync()
              {
                  if (_disposed)
                  {
                      return ValueTask.CompletedTask;
                  }

                  _disposed = true;
                  _cache.Clear();
                  foreach (var gate in _locks.Values)
                  {
                      gate.Dispose();
                  }

                  _locks.Clear();
                  return ValueTask.CompletedTask;
              }
          '@
          $newDispose = @'
              public ValueTask DisposeAsync()
              {
                  lock (_lifecycleSync)
                  {
                      if (_disposeTask is not null)
                      {
                          return new ValueTask(_disposeTask);
                      }

                      _disposed = true;
                      var drainTask = _activeOperations == 0
                          ? Task.CompletedTask
                          : _operationsDrained.Task;
                      _disposeTask = DisposeCoreAsync(drainTask);
                      return new ValueTask(_disposeTask);
                  }
              }

              private async Task DisposeCoreAsync(Task drainTask)
              {
                  await drainTask.ConfigureAwait(false);
                  _cache.Clear();
                  foreach (var gate in _locks.Values)
                  {
                      gate.Dispose();
                  }

                  _locks.Clear();
              }

              private void BeginOperation()
              {
                  lock (_lifecycleSync)
                  {
                      ObjectDisposedException.ThrowIf(_disposed, this);
                      _activeOperations++;
                  }
              }

              private void EndOperation()
              {
                  lock (_lifecycleSync)
                  {
                      _activeOperations--;
                      if (_disposed && _activeOperations == 0)
                      {
                          _operationsDrained.TrySetResult();
                      }
                  }
              }
          '@
          if (-not $text.Contains($oldDispose)) { throw 'Expected DisposeAsync block was not found.' }
          $text = $text.Replace($oldDispose, $newDispose)

          Set-Content -Path $path -Value $text -NoNewline
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ServerDesk.Application/Capabilities/ServerCapabilities.cs
          git diff --cached --check
          git commit -m "fix(capabilities): drain scans before disposal"
          git push
