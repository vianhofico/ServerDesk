name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish Windows release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout certified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid RELEASE_VERSION: $version"
          }

          $releaseSha = '${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}'
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $releaseSha) {
            throw "Checked out SHA $checkedOutSha does not match certified release SHA $releaseSha"
          }

          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_SHA=$releaseSha" >> $env:GITHUB_ENV

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$version"
          $response = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck

          switch ([int]$response.StatusCode) {
            200 {
              $existingRelease = $response.Content | ConvertFrom-Json
              $expectedAssetName = "ServerDesk-$version-win-x64.zip"
              $assetNames = @($existingRelease.assets | ForEach-Object { $_.name })
              if ($assetNames -notcontains $expectedAssetName -or $assetNames -notcontains 'SHA256SUMS.txt') {
                throw "Release $version already exists but is incomplete; refusing to silently treat it as published."
              }

              $commitUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$version"
              $commitResponse = Invoke-WebRequest -Uri $commitUri -Headers $headers -Method Get -SkipHttpErrorCheck
              if ([int]$commitResponse.StatusCode -ne 200) {
                throw "Existing release tag cannot be resolved. HTTP $($commitResponse.StatusCode)."
              }

              $tagCommit = ($commitResponse.Content | ConvertFrom-Json).sha
              if ($tagCommit -ne $releaseSha) {
                throw "Existing release tag resolves to $tagCommit instead of certified main $releaseSha."
              }

              "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              Write-Host "Release $version already exists with required assets on certified SHA; publication is idempotently skipped."
            }
            404 {
              "SKIP_RELEASE=false" >> $env:GITHUB_ENV
              Write-Host "Release $version does not exist yet; resolving smoke-tested artifact."
            }
            default {
              throw "Unable to determine release state for $version. GitHub API returned HTTP $($response.StatusCode)."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve exact successful release smoke run
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/release-smoke.yml/runs?branch=main&event=push&head_sha=$env:RELEASE_SHA&per_page=20"
          $selectedRun = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $response = Invoke-WebRequest -Uri $runsUri -Headers $headers -Method Get -SkipHttpErrorCheck
            if ([int]$response.StatusCode -ne 200) {
              throw "Unable to query Release Publish Smoke runs. HTTP $($response.StatusCode)."
            }

            $runs = @((($response.Content | ConvertFrom-Json).workflow_runs) | Where-Object {
              $_.head_sha -eq $env:RELEASE_SHA -and $_.event -eq 'push'
            })

            $selectedRun = $runs | Where-Object {
              $_.status -eq 'completed' -and $_.conclusion -eq 'success'
            } | Sort-Object run_number -Descending | Select-Object -First 1

            if ($null -ne $selectedRun) {
              break
            }

            $failedRun = $runs | Where-Object {
              $_.status -eq 'completed' -and $_.conclusion -notin @('success', 'skipped')
            } | Sort-Object run_number -Descending | Select-Object -First 1
            if ($null -ne $failedRun) {
              throw "Release Publish Smoke run $($failedRun.id) failed for certified SHA $env:RELEASE_SHA."
            }

            if ($attempt -eq 12) {
              throw "No successful Release Publish Smoke run found for certified SHA $env:RELEASE_SHA."
            }

            Write-Host "Waiting for Release Publish Smoke on $env:RELEASE_SHA (attempt $attempt/12)..."
            Start-Sleep -Seconds 10
          }

          "SMOKE_RUN_ID=$($selectedRun.id)" >> $env:GITHUB_ENV
          Write-Host "Using Release Publish Smoke run $($selectedRun.id) for $env:RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download verified release candidate
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $candidateDir = Join-Path $env:RUNNER_TEMP 'serverdesk-release-candidate'
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null

          gh run download $env:SMOKE_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name serverdesk-release-candidate `
            --dir $candidateDir
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download verified release candidate from smoke run $env:SMOKE_RUN_ID."
          }

          "CANDIDATE_DIR=$candidateDir" >> $env:GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release candidate provenance and checksum
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $candidateDir = $env:CANDIDATE_DIR
          $expectedAssetName = "ServerDesk-$env:VERSION-win-x64.zip"
          $assetPath = Join-Path $candidateDir $expectedAssetName
          $checksumPath = Join-Path $candidateDir 'SHA256SUMS.txt'
          $shaPath = Join-Path $candidateDir 'RELEASE_SHA.txt'
          $versionPath = Join-Path $candidateDir 'RELEASE_VERSION.txt'

          foreach ($requiredPath in @($assetPath, $checksumPath, $shaPath, $versionPath)) {
            if (-not (Test-Path $requiredPath)) {
              throw "Verified release candidate is missing $requiredPath."
            }
          }

          $candidateSha = (Get-Content $shaPath -Raw).Trim()
          $candidateVersion = (Get-Content $versionPath -Raw).Trim()
          if ($candidateSha -ne $env:RELEASE_SHA) {
            throw "Release candidate SHA $candidateSha does not match certified main $env:RELEASE_SHA."
          }
          if ($candidateVersion -ne $env:VERSION) {
            throw "Release candidate version $candidateVersion does not match expected $env:VERSION."
          }

          $checksumLine = (Get-Content $checksumPath -Raw).Trim()
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s{2}(.+)$') {
            throw "SHA256SUMS.txt has an invalid format."
          }

          $expectedHash = $Matches[1].ToLowerInvariant()
          $checksumAssetName = $Matches[2]
          if ($checksumAssetName -ne $expectedAssetName) {
            throw "Checksum references $checksumAssetName instead of $expectedAssetName."
          }

          $actualHash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Release candidate checksum mismatch: expected $expectedHash, observed $actualHash."
          }

          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" >> $env:GITHUB_ENV
          Write-Host "Verified release candidate provenance and SHA-256 for $expectedAssetName"

      - name: Create GitHub release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes file not found: $notes"
          }

          gh release create $env:VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title "ServerDesk $env:VERSION" `
            --notes-file $notes `
            $env:ASSET_PATH `
            $env:CHECKSUM_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VERSION"
          $releaseResponse = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck
          if ([int]$releaseResponse.StatusCode -ne 200) {
            throw "Release verification failed with HTTP $($releaseResponse.StatusCode)."
          }

          $release = $releaseResponse.Content | ConvertFrom-Json
          if ($release.tag_name -ne $env:VERSION) {
            throw "Published tag $($release.tag_name) does not match expected $env:VERSION."
          }

          $expectedAssetName = "ServerDesk-$env:VERSION-win-x64.zip"
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $expectedAssetName) {
            throw "Release is missing $expectedAssetName."
          }
          if ($assetNames -notcontains 'SHA256SUMS.txt') {
            throw "Release is missing SHA256SUMS.txt."
          }

          $commitUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:VERSION"
          $commitResponse = Invoke-WebRequest -Uri $commitUri -Headers $headers -Method Get -SkipHttpErrorCheck
          if ([int]$commitResponse.StatusCode -ne 200) {
            throw "Unable to resolve release tag commit. HTTP $($commitResponse.StatusCode)."
          }

          $tagCommit = ($commitResponse.Content | ConvertFrom-Json).sha
          if ($tagCommit -ne $env:RELEASE_SHA) {
            throw "Release tag resolves to $tagCommit instead of certified main $env:RELEASE_SHA."
          }

          Write-Host "Verified $env:VERSION at $env:RELEASE_SHA with assets: $($assetNames -join ', ')"
        env:
          GH_TOKEN: ${{ github.token }}
