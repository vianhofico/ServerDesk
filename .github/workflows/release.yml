name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest

    steps:
      - name: Checkout certified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid RELEASE_VERSION: $version"
          }

          $releaseSha = '${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}'
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $releaseSha) {
            throw "Checked out SHA $checkedOutSha does not match certified release SHA $releaseSha"
          }

          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_SHA=$releaseSha" >> $env:GITHUB_ENV

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$version"
          $response = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck

          switch ([int]$response.StatusCode) {
            200 {
              "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              Write-Host "Release $version already exists; publication is idempotently skipped."
            }
            404 {
              "SKIP_RELEASE=false" >> $env:GITHUB_ENV
              Write-Host "Release $version does not exist yet; continuing with publication."
            }
            default {
              throw "Unable to determine release state for $version. GitHub API returned HTTP $($response.StatusCode)."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish ServerDesk win-x64
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'serverdesk-publish'
          dotnet publish src/ServerDesk.App/ServerDesk.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -o $publishDir

          if (-not (Test-Path (Join-Path $publishDir 'ServerDesk.App.exe'))) {
            throw "Published ServerDesk.App.exe was not produced."
          }

      - name: Package and checksum
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'serverdesk-publish'
          $assetName = "ServerDesk-$env:VERSION-win-x64.zip"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          $checksumPath = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'

          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $assetPath -Force
          if (-not (Test-Path $assetPath)) {
            throw "Release ZIP was not created."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii $checksumPath

          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" >> $env:GITHUB_ENV

      - name: Create GitHub release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes file not found: $notes"
          }

          gh release create $env:VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title "ServerDesk $env:VERSION" `
            --notes-file $notes `
            $env:ASSET_PATH `
            $env:CHECKSUM_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VERSION"
          $releaseResponse = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck
          if ([int]$releaseResponse.StatusCode -ne 200) {
            throw "Release verification failed with HTTP $($releaseResponse.StatusCode)."
          }

          $release = $releaseResponse.Content | ConvertFrom-Json
          if ($release.tag_name -ne $env:VERSION) {
            throw "Published tag $($release.tag_name) does not match expected $env:VERSION."
          }

          $expectedAssetName = "ServerDesk-$env:VERSION-win-x64.zip"
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $expectedAssetName) {
            throw "Release is missing $expectedAssetName."
          }
          if ($assetNames -notcontains 'SHA256SUMS.txt') {
            throw "Release is missing SHA256SUMS.txt."
          }

          $commitUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:VERSION"
          $commitResponse = Invoke-WebRequest -Uri $commitUri -Headers $headers -Method Get -SkipHttpErrorCheck
          if ([int]$commitResponse.StatusCode -ne 200) {
            throw "Unable to resolve release tag commit. HTTP $($commitResponse.StatusCode)."
          }

          $tagCommit = ($commitResponse.Content | ConvertFrom-Json).sha
          if ($tagCommit -ne $env:RELEASE_SHA) {
            throw "Release tag resolves to $tagCommit instead of certified main $env:RELEASE_SHA."
          }

          Write-Host "Verified $env:VERSION at $env:RELEASE_SHA with assets: $($assetNames -join ', ')"
        env:
          GH_TOKEN: ${{ github.token }}
