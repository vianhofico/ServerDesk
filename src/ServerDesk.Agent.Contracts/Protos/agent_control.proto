syntax = "proto3";

package serverdesk.agent.v1;
option csharp_namespace = "ServerDesk.Agent.Contracts.V1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_METRICS_STREAMING = 1;
  AGENT_CAPABILITY_PROCESS_EVENTS = 2;
  AGENT_CAPABILITY_SERVICE_EVENTS = 3;
  AGENT_CAPABILITY_DOCKER_EVENTS = 4;
  AGENT_CAPABILITY_LOG_STREAMING = 5;
}

message NegotiateRequest {
  ProtocolVersion protocol = 1;
  string client_version = 2;
  repeated AgentCapability requested_capabilities = 3;
}

message NegotiateResponse {
  ProtocolVersion protocol = 1;
  string agent_version = 2;
  repeated AgentCapability capabilities = 3;
  string platform = 4;
  string architecture = 5;
}

enum AgentHealthState {
  AGENT_HEALTH_STATE_UNSPECIFIED = 0;
  AGENT_HEALTH_STATE_READY = 1;
  AGENT_HEALTH_STATE_DEGRADED = 2;
}

message HealthRequest {
}

message HealthResponse {
  AgentHealthState state = 1;
  string agent_version = 2;
  int64 started_unix_ms = 3;
}

message StreamMetricsRequest {
  uint32 interval_ms = 1;
}

message MetricsSample {
  int64 captured_unix_ms = 1;
  double cpu_utilization_percent = 2;
  uint64 memory_total_bytes = 3;
  uint64 memory_available_bytes = 4;
  uint64 memory_used_bytes = 5;
  double memory_used_percent = 6;
  double load_one_minute = 7;
  double load_five_minutes = 8;
  double load_fifteen_minutes = 9;
}

message EventStreamRequest {
  uint32 interval_ms = 1;
}

enum ProcessEventKind {
  PROCESS_EVENT_KIND_UNSPECIFIED = 0;
  PROCESS_EVENT_KIND_STARTED = 1;
  PROCESS_EVENT_KIND_EXITED = 2;
}

message ProcessEvent {
  ProcessEventKind kind = 1;
  int32 process_id = 2;
  string name = 3;
  int64 captured_unix_ms = 4;
}

enum ServiceState {
  SERVICE_STATE_UNKNOWN = 0;
  SERVICE_STATE_ACTIVE = 1;
  SERVICE_STATE_INACTIVE = 2;
  SERVICE_STATE_ACTIVATING = 3;
  SERVICE_STATE_DEACTIVATING = 4;
  SERVICE_STATE_FAILED = 5;
}

message ServiceEvent {
  string unit = 1;
  ServiceState previous_state = 2;
  ServiceState current_state = 3;
  int64 captured_unix_ms = 4;
}

message DockerEventsRequest {
}

enum DockerObjectType {
  DOCKER_OBJECT_TYPE_UNKNOWN = 0;
  DOCKER_OBJECT_TYPE_CONTAINER = 1;
  DOCKER_OBJECT_TYPE_IMAGE = 2;
  DOCKER_OBJECT_TYPE_VOLUME = 3;
  DOCKER_OBJECT_TYPE_NETWORK = 4;
  DOCKER_OBJECT_TYPE_DAEMON = 5;
}

enum DockerEventKind {
  DOCKER_EVENT_KIND_UNKNOWN = 0;
  DOCKER_EVENT_KIND_CREATE = 1;
  DOCKER_EVENT_KIND_START = 2;
  DOCKER_EVENT_KIND_STOP = 3;
  DOCKER_EVENT_KIND_DIE = 4;
  DOCKER_EVENT_KIND_DESTROY = 5;
  DOCKER_EVENT_KIND_PAUSE = 6;
  DOCKER_EVENT_KIND_UNPAUSE = 7;
  DOCKER_EVENT_KIND_RESTART = 8;
  DOCKER_EVENT_KIND_RENAME = 9;
  DOCKER_EVENT_KIND_HEALTH_STATUS = 10;
  DOCKER_EVENT_KIND_ATTACH = 11;
  DOCKER_EVENT_KIND_DETACH = 12;
  DOCKER_EVENT_KIND_KILL = 13;
  DOCKER_EVENT_KIND_OOM = 14;
  DOCKER_EVENT_KIND_UPDATE = 15;
  DOCKER_EVENT_KIND_CONNECT = 16;
  DOCKER_EVENT_KIND_DISCONNECT = 17;
  DOCKER_EVENT_KIND_PULL = 18;
  DOCKER_EVENT_KIND_PUSH = 19;
  DOCKER_EVENT_KIND_TAG = 20;
  DOCKER_EVENT_KIND_UNTAG = 21;
  DOCKER_EVENT_KIND_DELETE = 22;
  DOCKER_EVENT_KIND_MOUNT = 23;
  DOCKER_EVENT_KIND_UNMOUNT = 24;
  DOCKER_EVENT_KIND_RELOAD = 25;
  DOCKER_EVENT_KIND_PRUNE = 26;
  DOCKER_EVENT_KIND_EXEC_CREATED = 27;
  DOCKER_EVENT_KIND_EXEC_STARTED = 28;
  DOCKER_EVENT_KIND_EXEC_DIED = 29;
}

message DockerEvent {
  DockerObjectType object_type = 1;
  DockerEventKind kind = 2;
  string object_id = 3;
  int64 captured_unix_ms = 4;
}

message LogStreamRequest {
}

enum JournalLogSeverity {
  JOURNAL_LOG_SEVERITY_UNKNOWN = 0;
  JOURNAL_LOG_SEVERITY_EMERGENCY = 1;
  JOURNAL_LOG_SEVERITY_ALERT = 2;
  JOURNAL_LOG_SEVERITY_CRITICAL = 3;
  JOURNAL_LOG_SEVERITY_ERROR = 4;
  JOURNAL_LOG_SEVERITY_WARNING = 5;
  JOURNAL_LOG_SEVERITY_NOTICE = 6;
  JOURNAL_LOG_SEVERITY_INFO = 7;
  JOURNAL_LOG_SEVERITY_DEBUG = 8;
}

message JournalLogEntry {
  int64 captured_unix_ms = 1;
  JournalLogSeverity severity = 2;
  string message = 3;
  string identifier = 4;
  string systemd_unit = 5;
  int32 process_id = 6;
  string hostname = 7;
}

service AgentControl {
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc StreamMetrics(StreamMetricsRequest) returns (stream MetricsSample);
  rpc StreamProcessEvents(EventStreamRequest) returns (stream ProcessEvent);
  rpc StreamServiceEvents(EventStreamRequest) returns (stream ServiceEvent);
  rpc StreamDockerEvents(DockerEventsRequest) returns (stream DockerEvent);
  rpc StreamJournalLogs(LogStreamRequest) returns (stream JournalLogEntry);
}
