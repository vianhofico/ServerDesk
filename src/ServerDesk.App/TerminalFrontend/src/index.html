<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>ServerDesk Terminal</title>
  <link rel="stylesheet" href="terminal.css" />
  <style>
    :root { color-scheme: dark; font-family: "Cascadia Mono", Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f1419; }
    body { display: grid; grid-template-rows: auto 1fr; }
    #search { display: none; gap: 6px; align-items: center; padding: 7px 9px; background: #171e26; border-bottom: 1px solid #2b3744; }
    #search.open { display: flex; }
    #search input { min-width: 240px; flex: 1; max-width: 520px; padding: 5px 8px; border: 1px solid #405064; border-radius: 5px; background: #0f1419; color: #ecf3f8; outline: none; }
    #search button { padding: 5px 9px; border: 1px solid #405064; border-radius: 5px; background: #202b36; color: #ecf3f8; cursor: pointer; }
    #terminal { min-height: 0; width: 100%; height: 100%; padding: 8px; }
    .xterm { height: 100%; }
  </style>
</head>
<body>
  <div id="search" aria-label="Terminal search">
    <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search scrollback" />
    <button id="searchPrevious" type="button">Previous</button>
    <button id="searchNext" type="button">Next</button>
    <button id="searchClose" type="button">Close</button>
  </div>
  <div id="terminal"></div>
  <script src="terminal.js"></script>
</body>
</html>
